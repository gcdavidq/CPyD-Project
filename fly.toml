# =============================================================================
#  Alternativa a Render: despliegue en Fly.io
#
#  OJO: Fly.io ya no tiene plan gratuito y pide tarjeta de credito incluso para
#  una aplicacion minima. Se incluye por si prefieres esa plataforma o si algun
#  dia migras. La opcion recomendada es Render (ver docs/DESPLIEGUE.md).
#
#      fly launch --no-deploy
#      fly deploy
# =============================================================================
app = "votacion-distribuida"
primary_region = "scl"          # Santiago: la region mas cercana a Peru

[build]
  dockerfile = "DASHBOARD_VOTACION/Dockerfile"

[env]
  MODO_DASHBOARD  = "replay"
  FICHERO_DEMO    = "demo/ejecucion_real.jsonl"
  REPLAY_VELOCIDAD = "1.5"
  REPLAY_PAUSA_SEG = "5"
  FLASK_DEBUG     = "0"
  PORT            = "5000"

[http_service]
  internal_port = 5000
  force_https = true
  # A diferencia de Render, aqui se puede mantener siempre una instancia viva,
  # de modo que no hay arranque en frio.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout  = "5s"
    method   = "GET"
    path     = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
