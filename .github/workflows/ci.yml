name: CI

on:
  push:
    branches: [main, main-limpio, modernizacion]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  #  Compila el sistema C++ con MPI y ejecuta la bateria de tests.
  # ---------------------------------------------------------------------------
  cpp:
    name: C++ / MPI / OpenMP
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libopenmpi-dev openmpi-bin \
            libcurl4-openssl-dev libjsoncpp-dev

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Compilar
        run: cmake --build build --parallel

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      # La imagen Docker del cluster compila sin tests ni benchmarks y sin
      # copiar sus fuentes. Si algun objetivo pasa a depender de ellas, aqui
      # se ve antes que en un despliegue fallido.
      - name: La configuracion minima (la de Docker) tambien compila
        run: |
          cmake -S . -B build-min -DCMAKE_BUILD_TYPE=Release                 -DBUILD_TESTING=OFF -DBUILD_BENCHMARKS=OFF
          cmake --build build-min --parallel
          test -x build-min/votacion

      - name: Comprobar que MPI arranca
        run: mpirun --oversubscribe --allow-run-as-root -np 4 ./build/test_mpi

  # ---------------------------------------------------------------------------
  #  Compila la SPA de React y comprueba los tipos.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: DASHBOARD_VOTACION/frontend
        run: npm install --no-audit --no-fund

      - name: Comprobar tipos
        working-directory: DASHBOARD_VOTACION/frontend
        run: npm run check

      - name: Compilar
        working-directory: DASHBOARD_VOTACION/frontend
        run: npm run build

      - name: El build produjo los estaticos esperados
        run: |
          test -f DASHBOARD_VOTACION/static/dist/index.html
          ls DASHBOARD_VOTACION/static/dist/assets/*.js  > /dev/null
          ls DASHBOARD_VOTACION/static/dist/assets/*.css > /dev/null
          echo "Tamano del bundle:"
          du -sh DASHBOARD_VOTACION/static/dist

      - name: Guardar el build para el trabajo del dashboard
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: DASHBOARD_VOTACION/static/dist
          retention-days: 1

  # ---------------------------------------------------------------------------
  #  Verifica el generador de datos y que el dashboard levanta y responde.
  # ---------------------------------------------------------------------------
  python:
    name: Generador de datos + dashboard
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Recuperar el build del frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: DASHBOARD_VOTACION/static/dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install -r DASHBOARD_VOTACION/requirements.txt

      - name: Comprobar sintaxis
        run: |
          python -m compileall -q SCRIPTS DASHBOARD_VOTACION/app.py

      - name: El generador produce un CSV valido
        run: |
          python SCRIPTS/generador_votos.py --region 4 --escala 10 --salida /tmp/DATA --semilla 1
          test -f /tmp/DATA/votos_region4.csv
          head -1 /tmp/DATA/votos_region4.csv | grep -q "timestamp,region,dni,candidato,anomalo"
          echo "Filas generadas: $(wc -l < /tmp/DATA/votos_region4.csv)"

      - name: El dashboard arranca y responde
        working-directory: DASHBOARD_VOTACION
        run: |
          python app.py &
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/health && break
            sleep 1
          done
          curl -sf http://localhost:5000/health         | grep -q '"status": *"ok"'
          curl -sf http://localhost:5000/api/estadisticas > /dev/null
          # Todas las vistas de la SPA tienen que devolver 200.
          for ruta in / /panel /nodos /mapa /dashboard /sobre; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5000${ruta}")
            echo "  ${ruta} -> ${codigo}"
            test "$codigo" = "200"
          done

  # ---------------------------------------------------------------------------
  #  Comprueba que las imagenes Docker se construyen.
  # ---------------------------------------------------------------------------
  docker:
    name: Imagenes Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen del dashboard
        run: docker build -t votacion-dashboard ./DASHBOARD_VOTACION

      - name: Construir la imagen del cluster
        run: docker build -t votacion-cluster .
